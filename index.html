<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نوروزی 🌷</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: "Vazirmatn", Tahoma, system-ui, sans-serif;
        background: linear-gradient(180deg, #031b17, #052a22 55%, #0a3d31);
        color: #fff;
        min-height: 100vh;
        padding: 24px 16px 40px;
      }
      .wrap { max-width: 900px; margin: 0 auto; display: grid; gap: 20px; }
      header { text-align: center; }
      h1 {
        font-size: clamp(2rem, 6vw, 3rem);
        font-weight: 900;
        background: linear-gradient(to left, #6ee7b7, #99f6e4, #fef08a);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      header p { color: rgba(167,243,208,.75); margin-top: 6px; font-size: .95rem; }
      .card {
        background: rgba(255,255,255,.05);
        border: 1px solid rgba(255,255,255,.1);
        border-radius: 24px;
        padding: 24px;
        backdrop-filter: blur(8px);
        box-shadow: 0 10px 30px rgba(2,44,34,.35);
      }
      .label { color: #6ee7b7; font-size: .85rem; }
      .date-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
      .date-big { font-size: clamp(1.3rem, 4vw, 1.8rem); font-weight: 800; margin-top: 6px; }
      .clock { color: rgba(167,243,208,.6); font-size: .9rem; margin-top: 6px; }
      .pop { font-size: 3rem; animation: pop 2s infinite; }
      @keyframes pop { 50% { transform: scale(1.15); } }
      .cd-title { text-align: center; color: #6ee7b7; font-size: .85rem; margin-bottom: 16px; }
      .grid-cd { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; text-align: center; }
      .cell {
        background: rgba(6,68,50,.5);
        border: 1px solid rgba(52,211,153,.2);
        border-radius: 16px;
        padding: 18px 6px;
      }
      .cell .num {
        font-size: clamp(1.6rem, 6vw, 2.4rem);
        font-weight: 900;
        color: #fef08a;
        transition: opacity .25s, transform .25s;
      }
      .cell .unit { font-size: .75rem; color: rgba(167,243,208,.7); margin-top: 4px; }
      .fal-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
      h2 { font-size: 1.15rem; }
      button {
        background: #34d399;
        color: #052e22;
        border: none;
        border-radius: 999px;
        padding: 10px 20px;
        font-weight: 800;
        font-family: inherit;
        font-size: .95rem;
        cursor: pointer;
        transition: background .2s, transform .1s;
      }
      button:hover { background: #6ee7b7; }
      button:active { transform: scale(.95); }
      .fal-body {
        margin-top: 18px;
        background: rgba(0,0,0,.25);
        border-radius: 16px;
        padding: 20px;
        text-align: center;
        display: grid;
        gap: 10px;
        transition: opacity .3s;
      }
      .fal-body.hidden { display: none; }
      .fal-text { color: #fef9c3; font-size: 1.05rem; line-height: 2.1; }
      .fal-mean { color: #a7f3d0; font-size: .9rem; }
      .hint { margin-top: 18px; text-align: center; color: rgba(167,243,208,.55); font-size: .9rem; }
      .sin-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 16px; }
      @media (min-width: 560px) { .sin-grid { grid-template-columns: repeat(4, 1fr); } }
      @media (min-width: 820px) { .sin-grid { grid-template-columns: repeat(7, 1fr); } }
      .sin {
        background: rgba(6,68,50,.5);
        border: 1px solid rgba(52,211,153,.2);
        border-radius: 16px;
        padding: 16px 8px;
        text-align: center;
        transition: transform .2s;
      }
      .sin:hover { transform: translateY(-4px); }
      .sin .icon { font-size: 2rem; }
      .sin .name { font-weight: 800; margin-top: 8px; color: #d1fae5; }
      .sin .desc { font-size: .72rem; color: rgba(167,243,208,.7); margin-top: 4px; line-height: 1.7; }
      footer { text-align: center; color: rgba(167,243,208,.4); font-size: .75rem; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>🌷 نوروزی</h1>
        <p>داشبورد جشن نوروز — شمارش معکوس، تقویم شمسی و فال حافظ 🎉</p>
      </header>

      <section class="card date-row">
        <div>
          <div class="label">📅 امروز</div>
          <div class="date-big" id="jdate">—</div>
          <div class="clock" id="clock">—</div>
        </div>
        <div class="pop">🎂</div>
      </section>

      <section class="card">
        <div class="cd-title">⏳ تا تحویل سال (تقریب اعتدال بهاری UTC)</div>
        <div class="grid-cd">
          <div class="cell"><div class="num" id="d">۰</div><div class="unit">روز</div></div>
          <div class="cell"><div class="num" id="h">۰</div><div class="unit">ساعت</div></div>
          <div class="cell"><div class="num" id="m">۰</div><div class="unit">دقیقه</div></div>
          <div class="cell"><div class="num" id="s">۰</div><div class="unit">ثانیه</div></div>
        </div>
      </section>

      <section class="card">
        <div class="fal-head">
          <h2>🪶 فال حافظ</h2>
          <button id="falBtn">نیت کن و فال بگیر ✨</button>
        </div>
        <div class="hint" id="hint">نیّت کن، چشمت رو ببند و کلیک کن… 🌙</div>
        <div class="fal-body hidden" id="falBody">
          <p class="fal-text" id="falText"></p>
          <p class="fal-mean" id="falMean"></p>
        </div>
      </section>

      <section class="card">
        <h2>🪴 هفت‌سین ما</h2>
        <div class="sin-grid" id="sinGrid"></div>
      </section>

      <footer>ساخته‌شده با ❤️ برای نوروزِ ایرانی — Nowroozi</footer>
    </div>

    <script>
      // ─── اعداد فارسی ───
      var fa = function (n) {
        return String(n).replace(/\d/g, function (d) { return "۰۱۲۳۴۵۶۷۸۹"[+d]; });
      };

      // ─── تبدیل میلادی به شمسی ───
      function toJalali(gy, gm, gd) {
        var gdm = [0,31,59,90,120,151,181,212,243,273,304,334];
        var jy = gy <= 1600 ? 0 : 979;
        gy -= gy <= 1600 ? 621 : 1600;
        var gy2 = gm > 2 ? gy + 1 : gy;
        var days = 365*gy + Math.floor((gy2+3)/4) - Math.floor((gy2+99)/100)
                 + Math.floor((gy2+399)/400) - 80 + gd + gdm[gm-1];
        jy += 33*Math.floor(days/12053); days %= 12053;
        jy += 4*Math.floor(days/1461); days %= 1461;
        if (days > 365) { jy += Math.floor((days-1)/365); days = (days-1)%365; }
        var jm = days < 186 ? 1+Math.floor(days/31) : 7+Math.floor((days-186)/30);
        var jd = 1 + (days < 186 ? days%31 : (days-186)%30);
        return { jy: jy, jm: jm, jd: jd };
      }
      var JMONTHS = ["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
      var WDAYS = ["یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه","شنبه"];

      // ─── فال حافظ ───
      var FAALS = [
        { text: "یوسف گم‌گشته بازآید به کنعان غم مخور / کلبه احزان شود روزی گلستان غم مخور", meaning: "بعد از سختی، خبر خوشی در راه است. 🌸" },
        { text: "الا یا ایها الساقی ادر کاسا و ناولها / که عشق آسان نمود اول ولی افتاد مشکل‌ها", meaning: "مسیر عشق و کارتان آسان شروع نمی‌شود؛ صبور باشید. ⚔️" },
        { text: "دلا ز رنج‌ها رها باش و اندیشه فنا / که این جهان از آن نهانی‌ست و آن جهان از این جانی‌ست", meaning: "از دلتنگی گذشته دست بکش، روزهای روشن در راه‌اند. ☀️" },
        { text: "سحر با یاد او گفتم قسم تسبیح و تهلیل / که ما نیم و تو هستی، دمی بی‌ما مشو خیر", meaning: "یار و همراهانت به فکرت‌اند؛ دلگرم باش. 💚" },
        { text: "رسید مژده که ایام غم نخواهد ماند / چنان نماند و چنین نیز نخواهد ماند", meaning: "این روزهای سخت هم می‌گذرد؛ تمام می‌شوند. 🍂" },
        { text: "درخت دوستی بنشان که کام دل به بار آرد / نهال دشمنی برکن که رنج بی‌شمار آرد", meaning: "سرمایه‌ات روابط خوب است؛ روی رفاقت سرمایه‌گذاری کن. 🤝" },
        { text: "گفتم غم تو دارم گفتا غمت سر آید / گفتم که ماه من شو گفتا اگر برآید", meaning: "آرزوی دیرهنگام هم ممکن است؛ امیدت را از دست نده. 🌙" },
        { text: "هر که این آتش ندارد نیست باد به سودش / است کرم چو به کبری، نیم‌جان به شاهدش", meaning: "بی‌عشق و شور، هیچ کاری عطر ندارد؛ با ذوق پیش برو! 🔥" }
      ];

      // ─── هفت‌سین ───
      var HAFTSIN = [
        { icon: "🌱", name: "سبزه", desc: "نشانه سبزی و رویش دوباره" },
        { icon: "🍎", name: "سیب", desc: "نشانه سلامتی و زیبایی" },
        { icon: "🧄", name: "سیر", desc: "نشانه سلامتی و دوری بیماری" },
        { icon: "🍚", name: "سمنو", desc: "نشانه برکت و فراوانی" },
        { icon: "🌿", name: "سنجد", desc: "نشانه عشق و مهربانی" },
        { icon: "🥁", name: "سماق", desc: "نشانه صبر و پایداری" },
        { icon: "🪙", name: "سکه", desc: "نشانه ثروت و روزی" }
      ];

      var sinGrid = document.getElementById("sinGrid");
      HAFTSIN.forEach(function (s) {
        var div = document.createElement("div");
        div.className = "sin";
        div.innerHTML = '<div class="icon">' + s.icon + '</div><div class="name">' + s.name + '</div><div class="desc">' + s.desc + '</div>';
        sinGrid.appendChild(div);
      });

      document.getElementById("falBtn").addEventListener("click", function () {
        var f = FAALS[Math.floor(Math.random() * FAALS.length)];
        var body = document.getElementById("falBody");
        document.getElementById("hint").style.display = "none";
        document.getElementById("falText").textContent = f.text;
        document.getElementById("falMean").textContent = "🧿 " + f.meaning;
        body.classList.remove("hidden");
        body.style.opacity = 0;
        setTimeout(function () { body.style.opacity = 1; }, 30);
      });

      function pad(x) { return String(x).padStart(2, "0"); }

      function tick() {
        var now = new Date();
        // تاریخ شمسی
        var j = toJalali(now.getFullYear(), now.getMonth() + 1, now.getDate());
        document.getElementById("jdate").textContent =
          WDAYS[now.getDay()] + "، " + fa(j.jd) + " " + JMONTHS[j.jm - 1] + " " + fa(j.jy);
        document.getElementById("clock").textContent =
          "🕐 " + fa(now.getHours()) + ":" + fa(pad(now.getMinutes())) + ":" + fa(pad(now.getSeconds()));

        // شمارش معکوس (تقریب اعتدال بهاری: ۲۰ مارس ۰۸:۳۰ UTC)
        var y = now.getUTCFullYear();
        var target = Date.UTC(y, 2, 20, 8, 30);
        if (target <= now.getTime()) target = Date.UTC(y + 1, 2, 20, 8, 30);
        var diff = Math.max(0, target - now.getTime());
        document.getElementById("d").textContent = fa(Math.floor(diff / 86400000));
        document.getElementById("h").textContent = fa(Math.floor(diff / 3600000) % 24);
        document.getElementById("m").textContent = fa(Math.floor(diff / 60000) % 60);
        document.getElementById("s").textContent = fa(Math.floor(diff / 1000) % 60);
      }

      tick();
      setInterval(tick, 1000);
    </script>
  </body>
</html>
